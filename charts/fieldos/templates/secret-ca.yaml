{{- if and .Values.caBundle.pem (not .Values.caBundle.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fieldos.fullname" . }}-ca
  labels: {{- include "fieldos.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Prefer `caBundle.existingSecret` in production: a PEM inlined here lives in your values file
  # and in Helm's release history.
  {{ .Values.caBundle.key }}: |
{{ .Values.caBundle.pem | indent 4 }}
{{- end }}

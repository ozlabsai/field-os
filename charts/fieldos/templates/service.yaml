apiVersion: v1
kind: Service
metadata:
  name: {{ include "fieldos.fullname" . }}
  labels: {{- include "fieldos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "fieldos.selectorLabels" . | nindent 4 }}
---
# The StatefulSet's governing service. Headless (clusterIP: None) as StatefulSets require.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fieldos.fullname" . }}-headless
  labels: {{- include "fieldos.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector: {{- include "fieldos.selectorLabels" . | nindent 4 }}
